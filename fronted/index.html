<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo App</title>

<style>
    body {
        margin: 0;
        font-family: Arial;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d")
        no-repeat center center/cover;
    }

    .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        top: 0;
        left: 0;
    }

    .container {
        position: relative;
        width: 420px;
        background: rgba(255,255,255,0.95);
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .input-box {
        display: flex;
        gap: 10px;
    }

    input {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ddd;
    }

    button {
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        margin-left: 5px;
    }

    ul {
        list-style: none;
        padding: 0;
        margin-top: 20px;
    }

    li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f7f7f7;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
    }

    .left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
    }

    .done {
        text-decoration: line-through;
        color: gray;
    }

    .delete {
        background: red;
        border: none;
        color: white;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">
    <h1>🚀 My Todo</h1>

    <div class="input-box">
        <input id="title" placeholder="Write a note...">
        <button onclick="addTask()" style="background:#6c5ce7;">Add</button>
    </div>

    <ul id="list"></ul>
</div>

<script>

const API = "http://127.0.0.1:8000/tasks";

// 📥 LOAD
async function loadTasks() {
    const res = await fetch(API);
    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(task => {
        const li = document.createElement("li");

        const left = document.createElement("div");
        left.className = "left";

        const text = document.createElement("span");
        text.innerText = task.title;

        if (task.completed) {
            text.classList.add("done");
        }

        // 🔥 MAIN BUTTON (Complete / Delete)
        const actionBtn = document.createElement("button");

        if (!task.completed) {
            actionBtn.innerText = "Complete";
            actionBtn.style.background = "green";

            actionBtn.onclick = async () => {
                await fetch(`${API}/${task.id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        completed: true
                    })
                });

                loadTasks();
            };
        } else {
            actionBtn.innerText = "Delete";
            actionBtn.style.background = "red";

            actionBtn.onclick = async () => {
                await fetch(`${API}/${task.id}`, {
                    method: "DELETE"
                });

                loadTasks();
            };
        }

        left.appendChild(text);

        li.appendChild(left);
        li.appendChild(actionBtn);

        list.appendChild(li);
    });
}

// ➕ ADD
async function addTask() {
    const title = document.getElementById("title").value;

    if (!title) return;

    await fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ title })
    });

    document.getElementById("title").value = "";
    loadTasks();
}

// ENTER KEY
document.getElementById("title").addEventListener("keydown", e => {
    if (e.key === "Enter") addTask();
});

loadTasks();

</script>

</body>
</html>
